appId: com.bogacsmz.causestate
productName: Cause & State
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# The map (tiles, relief, label fonts) ships with the game: nothing to download or build.
extraResources:
  - from: resources/map
    to: map
mac:
  category: public.app-category.strategy-games
  target:
    - dmg
    - zip
  artifactName: Cause-State-${version}-${arch}.${ext}
win:
  target: nsis
  artifactName: Cause-State-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target: AppImage
  category: Game
  artifactName: Cause-State-${version}.${ext}
